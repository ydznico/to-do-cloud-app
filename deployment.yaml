apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: todo-app
          image: 994516184795.dkr.ecr.eu-north-1.amazonaws.com/todo-cloud-app:7a9370a3aac7b6c02fd481a77e167a6cd9e5d32f
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
