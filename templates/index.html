<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Stay organized. Get things done.</p>
        </header>

        <section class="stats" aria-label="Task summary">
            <div class="stat-card">
                <h2>{{ pending }}</h2>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <h2>{{ completed }}</h2>
                <p>Completed</p>
            </div>
        </section>

        <form action="{{ url_for('add_task') }}" method="POST" class="task-form">
            <input type="text" name="title" placeholder="What needs to be done?" required maxlength="200">
            <button type="submit">Add Task</button>
        </form>

        <section class="task-list" aria-label="Tasks">
            {% for task in tasks %}
            <article class="task {% if task.completed %}done{% endif %}">
                <span class="task-title">{{ task.title }}</span>
                <div class="actions">
                    <form action="{{ url_for('toggle_task', task_id=task.id) }}" method="POST">
                        <button class="complete-btn" type="submit">
                            {% if task.completed %}Undo{% else %}Complete{% endif %}
                        </button>
                    </form>
                    <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST">
                        <button class="delete-btn" type="submit">Delete</button>
                    </form>
                </div>
            </article>
            {% else %}
            <p class="empty">No tasks yet. Add your first task!</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
